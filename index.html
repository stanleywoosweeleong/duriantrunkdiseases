<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A2E24">
<meta name="description" content="榴莲树干与根部病害田间辨症 · Field triage for durian trunk and root disease · Kenal pasti penyakit batang dan akar durian">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icons/favicon-64.png?v=2" sizes="64x64" type="image/png">
<link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="辨症 Triage">
<meta name="mobile-web-app-capable" content="yes">
<title>榴莲树干病辨症 · Durian Trunk Disease Triage · Kenal Pasti Penyakit Batang Durian</title>
<style>
:root{
  --bark:#3A2E24; --bark2:#47392C; --bark3:#554636;
  --cream:#F6F0E5; --muted:#C9B8A1; --line:#6B5744;
  --husk:#B7C97E; --rust:#F08A66; --ink:#C7BAF5; --amber:#F0C063; --fus:#6FCBC2; --root:#E59BC4;
  --disp:Georgia,"Songti SC","Noto Serif SC",serif;
  --body:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bark); color:var(--cream); font-family:var(--body);
  font-size:15px; line-height:1.6;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  scroll-padding-bottom:120px;
}
.wrap{max-width:720px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right))}

/* durian husk spikes — used once, in the header */
.spikes{height:11px;background:
  repeating-linear-gradient(135deg,var(--husk) 0 1px,transparent 1px 9px),
  repeating-linear-gradient(45deg,var(--husk) 0 1px,transparent 1px 9px);
  opacity:.5}

header{background:var(--bark2);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px;padding:11px 0 12px}
.mark{font-family:var(--disp);font-size:21px;line-height:1.15;letter-spacing:.01em;flex:1}
.lang{background:transparent;border:1px solid var(--line);color:var(--cream);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:8px 11px;border-radius:2px;cursor:pointer}
.lang:hover{border-color:var(--husk)}


nav{position:fixed;bottom:0;left:0;right:0;background:var(--bark2);
  border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 2px 11px;min-height:52px;
  font-family:var(--body);font-size:10.5px;cursor:pointer;border-top:2px solid transparent}
nav button b{display:block;font-size:15px;font-weight:400;margin-bottom:3px;font-family:var(--disp)}
nav button[aria-current="true"]{color:var(--cream);border-top-color:var(--husk)}

section{display:none;padding:22px 0 30px}
section.on{display:block}
h2{font-family:var(--disp);font-size:22px;font-weight:400;margin:0 0 6px}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 20px}
h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 10px;font-weight:400}

.card{background:var(--bark2);border:1px solid var(--line);border-radius:3px;padding:14px;margin-bottom:10px}

/* signature: three scored pathways */
.fold button{background:none;border:0;padding:6px 0;min-height:44px;cursor:pointer;color:var(--muted);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;text-align:left}
.fold button:hover{color:var(--cream)}
.fold em{font-style:normal;opacity:.7}
.caret{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:none;
  border:1px solid var(--line);border-radius:3px;font-family:var(--body);font-size:12px;line-height:1}
html[lang="zh"] .fold button{font-size:13px;letter-spacing:.04em}
.helper{margin-top:4px}
.helper > h3{margin:0 0 9px}
.htabs{display:flex;gap:6px;margin-bottom:10px}
.htabs button{flex:1;min-width:0;min-height:52px;background:var(--bark2);border:1px solid var(--line);color:var(--muted);
  font-family:var(--body);font-size:11px;padding:9px 3px;border-radius:3px;cursor:pointer;line-height:1.3}
.htabs button b{display:block;font-weight:500;color:var(--cream);margin-bottom:2px}
.htabs button[aria-pressed="true"]{border-color:var(--husk);background:var(--bark3)}
.htabs button[aria-pressed="true"] b{color:var(--husk)}
html[lang="zh"] .htabs button{font-size:12.5px}
.share{background:var(--bark2);border:1px solid var(--line);border-radius:3px;
  padding:14px;margin-top:22px}
.share h3{margin:0 0 12px}
.share-row{display:flex;gap:14px;align-items:center}
.qr{width:132px;height:132px;flex:none;border-radius:4px;background:#F6F0E5;
  padding:0;shape-rendering:crispEdges}
.share-txt{flex:1;min-width:0}
.share-txt p{margin:0;font-size:13px;color:var(--muted);line-height:1.65}
.share-url{margin-top:8px!important;font-family:var(--mono);font-size:11px;
  color:var(--husk);word-break:break-all}
html[lang="zh"] .share-txt p{font-size:14.5px}
@media (max-width:400px){.share-row{flex-direction:column;align-items:flex-start}
  .qr{width:100%;max-width:200px;height:auto;align-self:center}}
.plate{background:var(--bark2);border:1px solid var(--line);border-radius:3px;padding:10px 8px 4px;margin-bottom:10px}
.plate svg{width:100%;height:auto;display:block}
.plate h3{margin:2px 6px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
html[lang="zh"] .plate h3{font-size:13px;letter-spacing:.04em}
.plate p{margin:2px 6px 8px;font-size:11.5px;color:var(--muted);line-height:1.55}
html[lang="zh"] .plate p{font-size:13.5px}
.nudge{background:var(--bark3);border-left:3px solid var(--muted);border-radius:3px;
  padding:10px 12px;margin-bottom:14px;font-size:12.5px;color:var(--muted);line-height:1.7}
html[lang="zh"] .nudge{font-size:14px}
.mixed{background:var(--bark2);border:1px solid var(--amber);border-left:4px solid var(--amber);
  border-radius:3px;padding:13px 14px;margin-bottom:14px}
.mixed h4{margin:0 0 8px;font-family:var(--disp);font-size:16px;font-weight:400;color:var(--amber)}
.mixed ul{margin:0;padding-left:17px;font-size:13px;line-height:1.7}
.mixed li{margin-bottom:6px}
html[lang="zh"] .mixed h4{font-size:18px}
html[lang="zh"] .mixed ul{font-size:14.5px;line-height:1.8}
.gauge{background:var(--bark2);border:1px solid var(--line);border-radius:3px;padding:15px 14px 13px;
  margin-bottom:10px}
/* compact sticky readout — sits right after the gauge, so it pins to the top
   exactly when the full gauge has scrolled away. ~46px, never half the screen. */
.mini{position:sticky;top:env(safe-area-inset-top);z-index:25;display:flex;align-items:center;gap:10px;
  background:var(--bark2);border:1px solid var(--line);border-radius:3px;
  padding:9px 12px;margin-bottom:14px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.mini-v{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-b{flex:none;width:62px;display:flex;flex-direction:column;gap:3px}
.mini-t{height:4px;border-radius:2px;background:var(--bark3);overflow:hidden}
.mini-f{height:100%;border-radius:2px;transition:width .35s ease}
.mini-n{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.grow{margin-bottom:11px}
.glabel{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.gname{font-size:13px;font-weight:500}
.gval{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.gtrack{height:9px;border-radius:5px;background:var(--bark3);overflow:hidden}
.gfill{height:100%;border-radius:5px;width:0;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.readout{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:13.5px;min-height:20px}
.readout b{font-family:var(--disp);font-size:16px;font-weight:400}
.legend{font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.lrow:last-child{margin-bottom:0}
.lrow .pin{margin:0;flex:none;min-width:52px;text-align:center}
.sym{display:flex;gap:11px;align-items:flex-start;min-height:52px;background:var(--bark2);border:1px solid var(--line);
  border-radius:3px;padding:12px 13px;margin-bottom:7px;cursor:pointer}
.sym:active{background:var(--bark3)}
.sym[data-on="1"]{border-color:var(--husk);background:var(--bark3)}
.fast .sym{padding:15px 14px}
.fast .sym p{font-size:15.5px}
html[lang="zh"] .fast .sym p{font-size:17.5px}
.box{width:17px;height:17px;border:1.5px solid var(--muted);border-radius:2px;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--bark)}
.sym[data-on="1"] .box{background:var(--husk);border-color:var(--husk);color:var(--bark)}
.sym p{margin:0;font-size:14px;flex:1}
.sym em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:3px}
.pins{flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pin{font-family:var(--body);font-size:10px;letter-spacing:.02em;padding:3px 7px;border-radius:3px;flex:none;margin-top:2px;white-space:nowrap}
.pin.p{background:var(--rust);color:#2E1207;font-weight:600}
.pin.f{background:var(--fus);color:#0E2A28;font-weight:600}
.pin.r{background:var(--root);color:#3A1226;font-weight:600}
.pin.n{background:var(--bark3);color:var(--muted)}
.pin.b{background:var(--ink);color:#231645;font-weight:600}

.reset{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);
  font-size:11px;padding:9px 14px;border-radius:2px;cursor:pointer;margin:14px 0 28px;width:100%}


.chem{background:var(--bark2);border:1px solid var(--line);border-radius:3px;margin-bottom:8px;overflow:hidden}
.chem-h{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer}
.chem-n{flex:1;min-width:0}
.chem-n b{font-weight:500;font-size:14.5px;display:block}
.chem-n span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em}
.stamps{flex:none;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.srow{display:flex;align-items:center;gap:6px}
.sgrp{font-size:10.5px;color:var(--muted);white-space:nowrap}
.stamp{font-family:var(--body);font-size:11px;padding:3px 8px;border:1.5px solid;border-radius:3px;flex:none;
  min-width:56px;text-align:center;white-space:nowrap}
html[lang="zh"] .sgrp{font-size:12px}
html[lang="zh"] .stamp{font-size:12.5px;min-width:62px}
.s-no{color:#2E1207;border-color:var(--rust);background:var(--rust);font-weight:600}
.s-yes{color:var(--husk);border-color:var(--husk);background:rgba(183,201,126,.14)}
.s-part{color:var(--amber);border-color:var(--amber);background:rgba(240,192,99,.14)}
.chem-b{display:none;padding:0 13px 14px;font-size:13.5px;border-top:1px solid var(--line);margin-top:0}
.chem[data-open="1"] .chem-b{display:block;padding-top:12px}
.kv{display:flex;gap:10px;margin-top:8px;font-size:12.5px}
.kv b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);
  text-transform:uppercase;flex:none;width:88px;padding-top:2px}
.basis{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:2px 6px;
  border-radius:2px;border:1px solid var(--line);color:var(--muted)}
.basis.field{border-color:var(--husk);color:var(--husk)}
.basis.inoc{border-color:var(--amber);color:var(--amber)}
.basis.plate{border-color:var(--fus);color:var(--fus)}
.basis.moa{border-color:var(--line);color:var(--muted)}
.reg{display:inline-block;font-size:11px;padding:3px 8px;border-radius:3px;border:1px solid;white-space:nowrap}
.reg.mrl{color:var(--husk);border-color:var(--husk);background:rgba(183,201,126,.14)}
.reg.pend{color:var(--amber);border-color:var(--amber);background:rgba(240,192,99,.14)}
.reg.none{color:var(--muted);border-color:var(--line)}
.finding{background:var(--bark2);border-left:3px solid var(--amber);border-radius:3px;
  padding:12px 13px;margin-bottom:14px;font-size:13.5px;line-height:1.7}
.risk{margin-top:9px;padding:9px 11px;border-radius:3px;background:rgba(240,138,102,.14);
  border-left:3px solid var(--rust);font-size:12.5px;line-height:1.65}
.lever{margin-bottom:11px}
.lever-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.lever-h b{font-size:15px;font-weight:500}
.lever-h span{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none}
.lever-t{height:7px;border-radius:4px;background:var(--bark3);overflow:hidden;margin-bottom:6px}
.lever-f{height:100%;border-radius:4px;background:var(--husk)}
.lever p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7}
.drop{opacity:.72}
.drop .chem-n b{text-decoration:line-through}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
td.ok{color:var(--husk)} td.bad{color:var(--rust)} td.part{color:var(--amber)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.step{display:flex;gap:12px;padding:13px;background:var(--bark2);border:1px solid var(--line);
  border-radius:3px;margin-bottom:8px;cursor:pointer}
.step[data-done="1"]{opacity:.55}
.step[data-done="1"] .step-t{text-decoration:line-through}
.step-n{font-family:var(--mono);font-size:11px;color:var(--husk);flex:none;padding-top:3px;width:20px}
.step-t{font-size:14.5px;margin:0 0 3px;font-weight:500}
.step-d{font-size:12.5px;color:var(--muted);margin:0}

.src{font-size:12.5px;padding:12px 0;border-bottom:1px solid var(--line)}
.src b{font-weight:500;display:block;margin-bottom:3px}
.src span{color:var(--muted)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.07em;padding:2px 6px;border-radius:2px;
  background:var(--bark3);color:var(--muted);margin-right:5px}
.tag.d{background:rgba(183,201,126,.2);color:var(--husk)}
.tag.g{background:rgba(199,186,245,.2);color:var(--ink)}

/* Chinese type scale — CJK glyphs read smaller than Latin at the same px,
   so every text-bearing size steps up when lang="zh", and the wide mono
   letter-spacing used for Latin eyebrows is pulled back for Chinese. */
html[lang="zh"] body{font-size:17px;line-height:1.8;padding-bottom:calc(116px + env(safe-area-inset-bottom))}
html[lang="zh"] .mark{font-size:24px}
html[lang="zh"] .lang{font-size:13px;letter-spacing:.04em;padding:8px 12px}
html[lang="zh"] nav button{font-size:12px}
html[lang="zh"] nav button b{font-size:16px}
html[lang="zh"] h2{font-size:25px;line-height:1.35}
html[lang="zh"] .lede{font-size:15px}
html[lang="zh"] h3{font-size:13px;letter-spacing:.06em}
html[lang="zh"] .gname{font-size:14.5px}
html[lang="zh"] .mini-v{font-size:14.5px}
html[lang="zh"] .legend{font-size:14px}
html[lang="zh"] .lrow .pin{min-width:62px}
html[lang="zh"] .mini-n{font-size:12px}
html[lang="zh"] .gval{font-size:12px}
html[lang="zh"] .readout{font-size:15.5px}
html[lang="zh"] .readout b{font-size:19px}
html[lang="zh"] .sym p{font-size:16px}
html[lang="zh"] .sym em{font-size:13.5px;margin-top:5px}
html[lang="zh"] .pin{font-size:12px;padding:3px 8px}
html[lang="zh"] .box{width:19px;height:19px;font-size:13px}
html[lang="zh"] .reset{font-size:13.5px;padding:11px 14px}
html[lang="zh"] .chem-n b{font-size:16.5px}
html[lang="zh"] .chem-n span{font-size:11.5px}
html[lang="zh"] .stamp{font-size:15px;padding:5px 10px}
html[lang="zh"] .chem-b{font-size:15px;line-height:1.8}
html[lang="zh"] .kv{font-size:14.5px}
html[lang="zh"] .kv b{font-size:11.5px;width:104px;letter-spacing:.04em}
html[lang="zh"] .basis{font-size:11px;letter-spacing:.02em;padding:3px 7px}
html[lang="zh"] .risk{font-size:14px}
html[lang="zh"] .reg{font-size:12.5px}
html[lang="zh"] .finding{font-size:15px}

html[lang="zh"] .lever-h b{font-size:16.5px}
html[lang="zh"] .lever p{font-size:14px}
html[lang="zh"] table{font-size:14.5px}
html[lang="zh"] th{font-size:11.5px;letter-spacing:.05em}
html[lang="zh"] td,html[lang="zh"] th{padding:11px 9px}
html[lang="zh"] .step-t{font-size:16.5px}
html[lang="zh"] .step-d{font-size:14px}
html[lang="zh"] .step-n{font-size:13px;width:24px}
html[lang="zh"] .src{font-size:14.5px;line-height:1.8}
html[lang="zh"] .tag{font-size:10.5px;letter-spacing:.03em;padding:3px 7px}
html[lang="zh"] .crow-h b{font-size:16.5px}
html[lang="zh"] .pill{font-size:13.5px;padding:4px 12px}
html[lang="zh"] .crow p{font-size:14.5px;line-height:1.8}
html[lang="zh"] .lyr{font-size:12px;letter-spacing:.05em}
html[lang="zh"] .crow .where{font-size:14px}

/* card rows — replace tables where CJK columns collapse on a phone */
.crow{background:var(--bark2);border:1px solid var(--line);border-radius:3px;padding:13px;margin-bottom:8px}
.crow-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px}
.crow-h b{flex:1;font-weight:500;font-size:15px;line-height:1.4}
.pill{white-space:nowrap;flex:none;font-size:12px;padding:4px 11px;border-radius:13px;border:1px solid;margin-top:1px}
.pill.ok{color:var(--husk);border-color:rgba(183,201,126,.7);background:rgba(183,201,126,.16)}
.pill.bad{color:#2E1207;border-color:var(--rust);background:var(--rust);font-weight:600}
.pill.part{color:var(--amber);border-color:rgba(240,192,99,.7);background:rgba(240,192,99,.16)}
.pill.note{color:var(--muted);border-color:var(--line);background:var(--bark3)}
.crow p{margin:0;font-size:13px;color:var(--muted);line-height:1.65}
.lyr{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--husk);margin-bottom:6px}
.crow .where{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:12.5px}
.crow .where b{font-weight:400;color:var(--husk)}

#upd{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(78px + env(safe-area-inset-bottom));z-index:60;
  background:var(--husk);color:#1B2408;border:0;border-radius:22px;
  padding:12px 20px;font-family:var(--body);font-size:14px;font-weight:600;
  box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer;max-width:calc(100% - 32px)}
#upd:disabled{opacity:.6}
html[lang="zh"] #upd{font-size:15.5px}

@media (max-width:520px){
  .wrap{padding-left:max(13px, env(safe-area-inset-left));padding-right:max(13px, env(safe-area-inset-right))}
  .kv{flex-direction:column;gap:3px}
  .kv b,html[lang="zh"] .kv b{width:auto}
  .chem-h{gap:8px}
  nav button{font-size:9.5px}
  html[lang="zh"] nav button{font-size:11.5px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

    my:{s:"mrl", mrl:"0.2 mg/kg", phi:{zh:"21 天",en:"21 days", ms:"21 hari"}}, v:"no", tier:"moa",
    zh2:"针对卵菌的内吸杀菌剂，对疫霉有活性，这也是它标签所列的用途。<br><br>作用靶标是卵菌的 RNA 聚合酶 I。葡萄座腔菌类与镰刀菌是真菌，没有这个靶标，所以本剂对它们没有活性——同样是病原类别的差异，不是产品的问题。<br><br>另外提醒：全球范围内疫霉对本组（FRAC 4）的抗性已相当普遍，即使确诊疫霉，也应与不同作用机理轮替，不要连续使用。",
    en2:"A systemic fungicide for oomycete diseases, active against Phytophthora, which is what its label covers.<br><br>Its target is oomycete RNA polymerase I. The Botryosphaeriaceae and Fusarium are fungi and do not carry that target, so the product has no activity against them — again a difference of pathogen group, not a shortcoming of the product.<br><br>Separately: resistance to this group (FRAC 4) is already widespread in Phytophthora worldwide, so even a confirmed Phytophthora case should be rotated with a different mode of action rather than treated repeatedly.", ms2:"Racun kulat sistemik untuk penyakit oomiset, aktif terhadap Phytophthora, dan itulah yang tertera pada labelnya.<br><br>Sasarannya ialah RNA polimerase I oomiset. Botryosphaeriaceae dan Fusarium ialah kulat dan tidak mempunyai sasaran itu, jadi produk ini tiada kesan terhadapnya — sekali lagi perbezaan kumpulan patogen, bukan kelemahan produk.<br><br>Selain itu: kerintangan terhadap kumpulan ini (FRAC 4) sudah meluas pada Phytophthora di seluruh dunia, jadi walaupun Phytophthora disahkan, ia patut digilirkan dengan cara tindakan yang lain dan bukan dirawat berulang kali." },
  { zh:"嘧菌酯", en:"Azoxystrobin", ms:"Azoxystrobin", oo:"part", frac:"FRAC 11 · QoI",
    my:{s:"none"}, v:"yes", tier:"moa",
    zh2:"甲氧基丙烯酸酯类（QoI），对葡萄座腔菌类有活性。它少见的地方是在文献中与木霉兼容——推荐剂量下单用或与苯醚甲环唑复配都不抑制木霉，是少数能与生物防治方案并存的化学药。<br><br>但要认清它的作用方式：QoI 主要阻断孢子萌发，是保护剂，治疗力弱。对已经在死木质里扩展的溃疡，它到不了病斑边缘——最合理的用法是修剪后保护新鲜伤口，不是治老病斑。",
    en2:"A strobilurin (QoI), active on the Botryosphaeriaceae. Its distinguishing feature is Trichoderma compatibility — at recommended rates, alone or mixed with difenoconazole, it did not inhibit Trichoderma, making it one of the few chemistries that can coexist with a biological programme.<br><br>But understand how it acts: QoI mainly blocks spore germination. It is a protectant with weak curative power, and it cannot reach the advancing margin of a canker already running inside dead wood. The sensible use is protecting fresh pruning wounds, not treating an old lesion.", ms2:"Strobilurin (QoI), aktif terhadap Botryosphaeriaceae. Keistimewaannya ialah keserasian dengan Trichoderma — pada kadar disyorkan, sama ada sendirian atau bercampur dengan difenoconazole, ia tidak merencat Trichoderma, menjadikannya antara sedikit bahan kimia yang boleh hidup bersama program biologi.<br><br>Tetapi fahami cara tindakannya: QoI terutamanya menyekat percambahan spora. Ia pelindung dengan kuasa penyembuhan yang lemah, dan tidak dapat mencapai pinggir kanker yang sudah merebak dalam kayu mati. Penggunaan yang munasabah ialah melindungi luka pangkasan yang baharu, bukan merawat lesi lama.",
    risk:{zh:"榴莲无残留标准，属标签外使用，风险自负。抗性风险高且是「断崖式」：细胞色素 b 第 143 位一个 G143A 点突变即可让整组 QoI 完全失效，并在组内交互抗性。一季不要超过两次，务必与不同机理轮替。另：镰刀菌对本类普遍不敏感，怀疑镰刀菌茎腐时不要指望它。",
      en:"No durian residue standard — off-label, at your own risk. Resistance risk is high and it fails off a cliff: a single G143A point mutation at codon 143 of cytochrome b can knock out the entire QoI group, with full cross-resistance inside it. No more than twice a season, always rotated with a different mode of action. Also: Fusarium is generally insensitive to this class — do not rely on it for a suspected collar rot.", ms:"Tiada piawai residu durian — di luar label, risiko ditanggung sendiri. Risiko kerintangan tinggi dan kegagalannya mendadak: satu mutasi titik G143A pada kodon 143 sitokrom b boleh melumpuhkan seluruh kumpulan QoI, dengan kerintangan silang penuh di dalamnya. Tidak lebih dua kali semusim, sentiasa digilirkan dengan cara tindakan yang lain. Juga: Fusarium umumnya tidak peka terhadap kelas ini."} },

  { zh:"铜制剂（氧氯化铜、氢氧化铜）", en:"Copper (oxychloride, hydroxide)", ms:"Kuprum (oksiklorida, hidroksida)", oo:"yes", frac:"FRAC M01 · 多位点",
    my:{s:"none"}, v:"part", tier:"moa",
    zh2:"多位点保护剂：同时作用于病菌体内多个靶标，所以病菌几乎无法靠单个突变躲开——几十年下来抗性问题一直很小。这正是它在抗性管理里的价值。<br><br>但要认清它只能保护、不能治疗：进不了已经形成的溃疡，也上不了树。用途是新鲜伤口与树皮表面的预防。对木霉有部分抑制（约 23–39%），与生物防治错开时间用。",
    en2:"A multi-site protectant: it hits several targets at once, so the fungus cannot dodge it with a single mutation — which is why resistance has stayed a minor problem after decades of use. That is exactly its value in a resistance programme.<br><br>Understand its limit: it protects but does not cure. It cannot reach an established canker and does not move in the tree. Its job is fresh wounds and bark surfaces. It partially inhibits Trichoderma (~23–39%), so separate it in time from biologicals.", ms2:"Pelindung berbilang tapak: ia menyerang beberapa sasaran serentak, jadi kulat tidak boleh mengelaknya dengan satu mutasi sahaja — sebab itulah kerintangan kekal menjadi masalah kecil selepas berdekad-dekad digunakan. Itulah nilainya dalam program pengurusan kerintangan.<br><br>Fahami hadnya: ia melindungi tetapi tidak menyembuhkan. Ia tidak dapat mencapai kanker yang sudah terbentuk dan tidak bergerak dalam pokok. Tugasnya ialah luka baharu dan permukaan kulit kayu. Ia merencat Trichoderma sebahagiannya (~23–39%), jadi asingkan masa penggunaannya daripada agen biologi.",
    risk:{zh:"榴莲无残留标准，属标签外使用。抗性风险低（多位点）——在只有两个单位点组可用的情况下，这一条比它的防效更重要。", en:"No durian residue standard — off-label. Resistance risk low (multi-site), and with only two single-site groups available that property matters more than its raw efficacy.", ms:"Tiada piawai residu durian — di luar label. Risiko kerintangan rendah (berbilang tapak), dan dengan hanya dua kumpulan satu tapak yang ada, sifat itu lebih penting daripada keberkesanan mentahnya."} },
  { zh:"代森锰锌", en:"Mancozeb", ms:"Mancozeb", oo:"yes", frac:"FRAC M03 · 多位点",
    my:{s:"none"}, v:"part", tier:"moa",
    zh2:"另一支多位点保护剂，抗性风险同样低，常作为单位点药的混配伙伴以延缓抗性。同样只保护不治疗，对已扩展的干部溃疡没有治疗作用。",
    en2:"A second multi-site protectant with the same low resistance risk, commonly used as a mixing partner for single-site products to slow resistance. Also protectant only, with no curative action on an advancing trunk canker.", ms2:"Pelindung berbilang tapak yang kedua dengan risiko kerintangan yang sama rendah, lazim digunakan sebagai pasangan campuran bagi produk satu tapak untuk melambatkan kerintangan. Juga pelindung sahaja, tanpa kesan penyembuhan pada kanker batang yang sedang merebak.",
    risk:{zh:"榴莲无残留标准，属标签外使用。多地正在收紧代森类的登记，用前先查马来西亚现行名录。", en:"No durian residue standard — off-label. Registration of the dithiocarbamates is tightening in many jurisdictions; check the current Malaysian listing first.", ms:"Tiada piawai residu durian — di luar label. Pendaftaran ditiokarbamat semakin diketatkan di banyak negara; semak senarai Malaysia yang terkini dahulu."} },
  { zh:"SDHI 类（FRAC 7）", en:"SDHI group (FRAC 7)", ms:"Kumpulan SDHI (FRAC 7)", oo:"no", frac:"FRAC 7 · SDHI",
    my:{s:"none"}, v:"yes", tier:"moa",
    zh2:"琥珀酸脱氢酶抑制剂，作用点与三唑类（FRAC 3）、甲氧基丙烯酸酯类（FRAC 11）都不同，因此可以作为第三个轮替组——这是本页最值得知道的一条，因为只有两个组可轮时，抗性只是早晚问题。氟吡菌酰胺、氟唑菌酰胺等在大马已有登记（其他作物），但榴莲没有残留标准。<br><br>提醒一：SDHI 本身也是单位点，抗性风险中至高，它是多一个组，不是安全牌。<br><br>提醒二：市面上的 SDHI 产品很多是复配的——常与三唑类或甲氧基丙烯酸酯类做成一瓶。买到 FRAC 7＋11 的复配，等于同时用了两个组，不是换掉了甲氧基丙烯酸酯类。轮替要看瓶上的 FRAC 号，不是看商品名。",
    ms2:"Perencat suksinat dehidrogenase mengikat pada tapak yang berbeza daripada triazol (FRAC 3) dan strobilurin (FRAC 11), jadi ia menawarkan kumpulan penggiliran ketiga — perkara paling berguna di halaman ini, kerana dengan hanya dua kumpulan untuk digilirkan, kerintangan hanyalah soal bila, bukan sama ada. Fluopyram dan fluxapyroxad berdaftar di Malaysia untuk tanaman lain, tetapi tiada piawai residu durian.<br><br>Nota satu: SDHI sendiri bersifat satu tapak dengan risiko kerintangan sederhana hingga tinggi. Ini satu kumpulan tambahan, bukan pilihan yang selamat.<br><br>Nota dua: banyak produk SDHI di pasaran ialah campuran siap, lazimnya dipasangkan dengan triazol atau strobilurin dalam botol yang sama. Membeli campuran FRAC 7 + 11 bermakna menggunakan kedua-dua kumpulan, bukan menggilirkan strobilurin. Baca nombor FRAC pada label, bukan nama dagang.", en2:"Succinate dehydrogenase inhibitors bind at a site different from both the triazoles (FRAC 3) and the strobilurins (FRAC 11), so they offer a third rotation group — the most useful thing on this page, because with only two groups to alternate, resistance is a matter of when rather than whether. Fluopyram and fluxapyroxad are registered in Malaysia on other crops, but there is no durian residue standard.<br><br>Note one: SDHIs are themselves single-site with moderate to high resistance risk. This is one more group, not a safe option.<br><br>Note two: many SDHI products on the shelf are pre-mixes, commonly paired with a triazole or a strobilurin in the same bottle. Buying a FRAC 7 + 11 mix means using both groups, not rotating away from the strobilurin. Read the FRAC numbers on the label, not the trade name.",
    risk:{zh:"榴莲无残留标准，属标签外使用。单位点，需与不同机理轮替，一季不超过两次。对榴莲干部病害没有田间数据。", en:"No durian residue standard — off-label. Single-site: rotate with other modes of action, no more than twice a season. No field data for durian trunk disease.", ms:"Tiada piawai residu durian — di luar label. Satu tapak: gilirkan dengan cara tindakan lain, tidak lebih dua kali semusim. Tiada data ladang untuk penyakit batang durian."} },
  { zh:"苯醚甲环唑", en:"Difenoconazole", ms:"Difenoconazole", oo:"no", frac:"FRAC 3 · DMI",
    my:{s:"pend", mrl:"0.8 mg/kg", phi:{zh:"1 天",en:"1 day", ms:"1 hari"}}, v:"yes", tier:"moa",
    zh2:"三唑类，对真菌有活性——本表唯一一支。但榴莲 MRL 仍标示「待宪报」，宪报前不应视为可用。另需注意：三唑类会抑制木霉，与生物防治只能轮替、不能混桶。对榴莲干部病害没有田间防效数据。",
    en2:"A triazole with activity on fungi — the only one in this table. But its durian MRL is still marked awaiting gazette, and should not be treated as available before that. Note also that triazoles suppress Trichoderma: rotate with biologicals, never tank-mix. There is no field-efficacy data for durian trunk disease.", ms2:"Triazol yang aktif terhadap kulat — satu-satunya dalam jadual ini. Tetapi MRL duriannya masih bertanda menunggu warta, dan tidak patut dianggap sudah boleh digunakan sebelum itu. Perhatikan juga bahawa triazol merencat Trichoderma: gilirkan dengan agen biologi, jangan sekali-kali campur dalam tangki yang sama. Tiada data keberkesanan ladang untuk penyakit batang durian.",
    risk:{zh:"中等抗性风险（单位点）。宪报状态请自行到 LRMP 登记名录复核，本软件不作时效保证。", en:"Moderate resistance risk (single-site). Verify the gazette status yourself on the LRMP register — this app makes no guarantee of currency.", ms:"Risiko kerintangan sederhana (satu tapak). Sahkan sendiri status wartanya dalam daftar LRMP — aplikasi ini tidak menjamin kemaskiniannya."} }
];

/* ---------- borers: the doorway the fungi come through ---------- */
var BORER = [
  { s:"do", zh:"天牛：一孔一虫，可以逐个处理", en:"Longhorn: one hole, one larva — treatable individually", ms:"Tanduk panjang: satu lubang, satu larva — boleh dirawat satu per satu",
    zh2:"母虫在树皮上咬一个凹槽把卵产在皮下，幼虫先在韧皮部取食，长大后钻进心材化蛹，这时才看得到孔、流胶和木屑。做法：刮净木屑确认还活着，用硬铁丝顺虫道捅到底；两周内没有新木屑，才算处理掉。",
    en2:"The female chews a depression in the bark and lays under it; the larva feeds in the phloem first, then bores into the heartwood to pupate — which is when the hole, the sap and the frass become visible. Method: clear the frass, confirm it is alive, then run a stiff wire down the tunnel. Only two weeks with no new frass counts as done.", ms2:"Kumbang betina mengunyah lekuk pada kulit kayu dan bertelur di bawahnya; larvanya makan dalam floem dahulu, kemudian menggerek masuk ke teras kayu untuk menjadi pupa — ketika itulah lubang, getah dan habuk kayu mula kelihatan. Kaedah: bersihkan habuk kayu, sahkan ia masih hidup, kemudian masukkan dawai keras menyusur terowong itu. Hanya dua minggu tanpa habuk kayu baharu barulah dikira selesai." },
  { s:"harm", zh:"别封住还活着的虫道", en:"Never seal a tunnel that is still active", ms:"Jangan sekali-kali tutup terowong yang masih aktif",
    zh2:"封住等于把幼虫关在里面继续啃，同时把水汽封进一段你根本消不了毒的木头里——这正是可可毛色二孢最想要的环境。要封，也只封表面伤口，虫道口留着透气排水。",
    en2:"Sealing traps the larva to keep chewing and shuts moisture into wood you cannot sterilise — precisely the conditions Lasiodiplodia wants. If you dress anything, dress the surface wound and leave the tunnel mouth open to drain and dry.", ms2:"Menutupnya mengurung larva supaya terus menggerek dan mengunci kelembapan dalam kayu yang tidak dapat anda nyahkuman — tepat keadaan yang dikehendaki Lasiodiplodia. Jika hendak merawat, rawat luka permukaan dan biarkan mulut terowong terbuka supaya kering." },
  { s:"harm", zh:"小蠹成片：别一个个治，那是结果不是原因", en:"Shot-holes in numbers: a symptom, not the cause", ms:"Lubang halus yang banyak: gejala, bukan puncanya",
    zh2:"针孔太小太多，逐孔处理没有意义。更重要的是：榴莲上的小蠹多出现在已经有根腐／茎腐的树上，它们钻的孔又把病害带到树的其他部位。看到成片针孔，先回「判症」页查根颈，而不是先打虫。",
    en2:"The pinholes are too small and too many for hole-by-hole work. More importantly, shot-hole borers on durian are found mostly on trees that already have root or stem rot, and their holes carry that disease into other parts of the tree. Seeing pinholes in numbers means going back to Triage and checking the collar — not reaching for an insecticide.", ms2:"Lubang halus itu terlalu kecil dan terlalu banyak untuk dirawat satu per satu. Lebih penting lagi, penggerek lubang jarum pada durian kebanyakannya ditemui pada pokok yang sudah mengalami reput akar atau reput batang, dan lubangnya membawa penyakit itu ke bahagian lain pokok. Melihat banyak lubang halus bermakna kembali ke tab Kenal Pasti dan memeriksa pangkal batang — bukan mencapai racun serangga." },
  { s:"do", zh:"降低虫压的其实是树势与清园", en:"What actually lowers borer pressure is vigour and sanitation", ms:"Yang benar-benar mengurangkan tekanan penggerek ialah kecergasan pokok dan kebersihan kebun",
    zh2:"两类蛀虫都偏好受伤、缺水、涝害或挂果过重的树。枯枝是天牛的繁殖场——剪下来就搬走烧掉，别堆在园里。除草机、绑绳、施肥铲在根颈留下的伤口，是产卵的首选位置。",
    en2:"Both kinds prefer trees that are wounded, drought-stressed, waterlogged or over-cropped. Dead limbs are longhorn breeding sites — carry prunings out and burn them rather than stacking them in the orchard. Strimmer cuts, tie wounds and spade damage at the collar are the preferred egg-laying sites.", ms2:"Kedua-dua jenis lebih gemarkan pokok yang cedera, tertekan kemarau, bertakung air atau terlalu lebat berbuah. Dahan mati ialah tempat pembiakan kumbang tanduk panjang — bawa sisa pangkasan keluar dan bakar, jangan ditimbun dalam kebun. Luka mesin rumput, luka tali dan kerosakan cangkul di pangkal batang ialah tempat bertelur yang paling digemari." },
  { s:"harm", zh:"小蠹：没有一支药能可靠地治好它——这不是本软件的说法", en:"Shot-hole borers: no product reliably controls them — and that is not this app's opinion", ms:"Penggerek lubang jarum: tiada racun yang mengawalnya dengan pasti — dan itu bukan pendapat aplikasi ini",
    zh2:"斯里兰卡在茶树上研究这种小蠹超过半个世纪，结论是：杀虫剂即使在正确时机使用，对未处理对照也只有约 40% 的防效，靠的是减少新虫道、压低下一代数量，不是把树里的虫杀掉。<br><br>近缘的多食性小蠹（PSHB）情况更清楚：目前没有有效的防治手段，实验室里有效的商品化生物制剂，喷到树皮外表后对成虫存活与繁殖影响有限。相关综述的结论是——除了维持树势与清除严重受害的木材，可用的手段很有限。<br><br>原因有三：虫在边材深处的虫道里，表面喷雾到不了；它不吃木头，吃自己养的真菌，所以内吸药也大多打不中；真正伤树的有一部分是那种共生真菌，不是虫本身。<br><br>所以：听到「有一支药可以根治蛀虫」，先想想上面这些数字。钱花在排水、树势与清除病株上，回报确定得多。",
    en2:"Sri Lanka has studied this borer in tea for over half a century. The conclusion: insecticides used at the correct time give only about 40% control over untreated, and they work by reducing new gallery formation and cutting the next generation's numbers — not by killing the beetles already inside the tree.<br><br>For the closely related polyphagous shot hole borer the position is plainer still: there is currently no effective control measure, and commercial biological products that worked in the laboratory had limited effect on beetle survival and reproduction once applied to the outer bark in the field. Reviews conclude there are limited options beyond maintaining tree vigour and removing severely infested material.<br><br>Three reasons: the beetle sits in galleries deep in the sapwood where a surface spray cannot reach; it does not eat wood but farms its own fungus, so systemics largely miss it; and part of the damage is that symbiotic fungus rather than the insect.<br><br>So when someone tells you a product will cure your borers, weigh it against those numbers. Money spent on drainage, tree vigour and removing affected trees returns far more reliably.", ms2:"Sri Lanka telah mengkaji penggerek ini pada pokok teh lebih setengah abad. Kesimpulannya: racun serangga yang digunakan pada masa yang betul hanya memberi kira-kira 40% kawalan berbanding tanpa rawatan, dan ia berkesan dengan mengurangkan pembentukan terowong baharu serta menurunkan bilangan generasi seterusnya — bukan dengan membunuh kumbang yang sudah berada dalam pokok.<br><br>Bagi penggerek lubang jarum polifagus yang berkait rapat, keadaannya lebih jelas lagi: setakat ini tiada langkah kawalan yang berkesan, dan produk biologi komersial yang berkesan di makmal memberi kesan terhad pada kemandirian dan pembiakan kumbang apabila disapu pada kulit luar di ladang. Ulasan kajian menyimpulkan pilihan adalah terhad selain mengekalkan kecergasan pokok dan membuang bahan yang teruk dijangkiti.<br><br>Tiga sebabnya: kumbang berada dalam terowong jauh di dalam kayu gubal yang tidak dapat dicapai semburan permukaan; ia tidak makan kayu tetapi menternak kulatnya sendiri, jadi racun sistemik kebanyakannya tersasar; dan sebahagian kerosakan itu datang daripada kulat simbiotik, bukan serangganya." },
  { s:"note", zh:"天牛的化学防治：时机比药重要", en:"Chemicals for longhorn borers: timing beats product", ms:"Bahan kimia untuk penggerek tanduk panjang: masa lebih penting daripada racun",
    zh2:"大马榴莲残留资料库中有登记残留标准的杀虫剂包括三氟氯氰菊酯（MRL 0.1 mg/kg，安全间隔期 7 天）——菊酯类，也是国外用于树干预防性喷施的那一类。要认清它的用途：预防成虫产卵，不是杀已经钻进心材的幼虫。喷得对不对，看的是有没有对上成虫活动期。具体产品与用法以标签及农艺师意见为准，本软件不作推荐。",

    en2:"Cuts off both the spore source and the entry point. The Botryosphaeriaceae enter through fresh pruning wounds via airborne conidia, and prunings left in the orchard are next season's inoculum. Costs nothing, moves the most.", ms2:"Memutuskan kedua-dua sumber spora dan pintu masuknya. Botryosphaeriaceae masuk melalui luka pangkasan baharu menerusi konidia di udara, dan sisa pangkasan yang ditinggalkan dalam kebun ialah sumber jangkitan musim depan. Tiada kos, kesan paling besar." },
  { w:82, zh:"排水与树势", en:"Drainage and tree vigour", ms:"Saliran dan kecergasan pokok",
    zh2:"文献原话：这类溃疡与回枯在长势差的立地最严重，树势旺时溃疡扩展通常被遏止。疫霉需要自由水，镰刀菌趁根颈长期潮湿入侵，根部病害也在积水的园里最凶——四种病的诱因都在这里。",
    en2:"Straight from the literature: these cankers and diebacks are most severe where trees grow poorly, and canker development is usually arrested on vigorous trees. Phytophthora needs free water, Fusarium exploits a permanently damp collar, and root disease is worst in waterlogged blocks — all four trace back to this.", ms2:"Terus daripada kajian: kanker dan mati rosot ini paling teruk di tempat pokok tumbuh lemah, dan perkembangan kanker biasanya terhenti pada pokok yang cergas. Phytophthora perlukan air bebas dan Fusarium memanfaatkan pangkal batang yang sentiasa lembap — ketiga-tiga patogen berbalik kepada perkara ini." },
  { w:55, zh:"生物防治", en:"Biologicals", ms:"Agen biologi",
    zh2:"木霉涂伤口＋芽孢杆菌喷干灌根。田间可期望的量级是 53.51%（海南镰刀菌茎腐），不是九成。作为常规打底，不是救火手段。",
    en2:"Trichoderma into wounds plus Bacillus on trunk and soil. The realistic field magnitude is 53.51% (Hainan, Fusarium stem rot), not 90%. A routine base layer, not a rescue.", ms2:"Trichoderma pada luka serta Bacillus pada batang dan tanah. Magnitud ladang yang realistik ialah 53.51% (Hainan, reput batang Fusarium), bukan 90%. Lapisan asas rutin, bukan penyelamat." },
  { w:30, zh:"化学药剂", en:"Chemical fungicides", ms:"Racun kulat kimia",
    zh2:"排最后，有原因：树干溃疡长在死木质里，没有活的输导组织，内吸药很难到达正在扩展的病斑边缘。这也是所有木本作物干部病害化学防治都不理想的原因。仅在确诊真菌性溃疡且快速扩展时使用，并严格轮替机理。",
    en2:"Last, for a reason: a trunk canker sits in dead wood with no functioning xylem, so systemic fungicides struggle to reach the advancing margin. This is why chemical control underperforms for trunk disease across every woody crop. Use only for a confirmed, fast-advancing fungal canker, and rotate modes of action strictly.", ms2:"Terakhir, dan ada sebabnya: kanker batang berada dalam kayu mati tanpa xilem yang berfungsi, jadi racun kulat sistemik sukar mencapai pinggir yang sedang merebak. Inilah sebabnya kawalan kimia kurang berkesan untuk penyakit batang pada semua tanaman berkayu. Gunakan hanya untuk kanker kulat yang disahkan dan merebak cepat, dan gilirkan cara tindakan dengan ketat." }

  { zh:"判到根部病害，换一套做法", en:"If it is root disease, change the whole approach", ms:"Jika ia penyakit akar, tukar seluruh pendekatan",

  { zh:"环剥过半就别再治了", en:"Past half-girdled, stop treating", ms:"Melebihi separuh lilitan, berhenti merawat",
    zh2:"病斑绕枝条或树干超过一半，上面就断了水源。砍到病斑以下，搬走烧掉。主干根颈过半，整棵列入替换——留着是园里的孢子源。", en2:"Once a lesion wraps more than half the circumference, everything above it has lost its water supply. Cut below it and carry it out to burn. If the trunk at the collar is past half, plan replacement — a standing dead tree is a spore source.", ms2:"Apabila lesi melingkari lebih separuh lilitan, semua di atasnya sudah kehilangan bekalan air. Potong di bawahnya dan bawa keluar untuk dibakar. Jika batang di pangkal sudah melebihi separuh, rancang penggantian — pokok mati yang dibiarkan berdiri ialah sumber spora." },
  { zh:"回头看伤口有没有在愈合", en:"Go back and see whether the wound is closing", ms:"Kembali dan lihat sama ada luka itu sedang menutup",
    zh2:"不用尺。看边缘：新长出一圈微微隆起的愈伤组织，颜色比病斑浅，就是止住了；边缘还是湿的、还在往外扩，就是没止住。隔几周看同一棵，比记数字管用。", en2:"No ruler needed. Look at the margin: a slightly raised ring of callus, paler than the lesion, means it has stopped; a margin still wet and still creeping means it has not. Revisit the same tree a few weeks later — that tells you more than any number.", ms2:"Tidak perlu pembaris. Lihat pinggirnya: lingkaran kalus yang timbul sedikit dan lebih pucat daripada lesi bermakna ia sudah berhenti; pinggir yang masih basah dan masih merayap bermakna belum. Lawati semula pokok yang sama beberapa minggu kemudian — itu memberitahu lebih banyak daripada sebarang angka." }

  { s:"do", zh:"采前：别让果实碰地、碰湿", en:"Before harvest: keep fruit off the ground and out of the wet", ms:"Sebelum menuai: jauhkan buah daripada tanah dan kelembapan",

    en2:"Clear fallen and rotten fruit from under the tree — they are the inoculum for the next batch. Thin or lift low-hanging fruit; keep the orchard drained, because a drier soil surface splashes less. Deal with the disease on the trunk first and the pressure on the fruit halves itself.", ms2:"Bersihkan buah gugur dan buah reput di bawah pokok — itulah sumber jangkitan untuk kelompok seterusnya. Jarangkan atau angkat buah yang rendah; pastikan saliran kebun baik, kerana permukaan tanah yang lebih kering kurang memercik. Uruskan penyakit pada batang dahulu dan tekanan pada buah akan berkurang separuh dengan sendirinya." },
  { s:"do", zh:"采收：伤口和落地是两个最大来源", en:"At harvest: wounds and ground contact are the two biggest sources", ms:"Semasa menuai: luka dan sentuhan tanah ialah dua punca terbesar",
    zh2:"留一段果柄，别齐着果蒂剪；接住，别让果实直接落地；箩筐、垫布、地面先清干净。采后堆在裸土上，等于把土里的疫霉直接送到果面。",

  { s:"note", zh:"采后处理：有数据，但别当万灵药", en:"Postharvest dips: there is data, but it is not a cure-all", ms:"Rendaman lepas tuai: ada datanya, tetapi bukan penyelesaian menyeluruh",

    zh2:"一把没消过的锯子，可以把一棵树的病带到接下来二十棵。同一棵树上，从病斑切到健康部位之前也要消一次——不然你只是把病菌往干净的木头里推。",
    en2:"One unsterilised saw can carry a single tree's problem into the next twenty. Do it within a tree too, before moving from a lesion to clean wood — otherwise you are just pushing the pathogen into sound timber.", ms2:"Satu gergaji yang tidak dinyahkuman boleh membawa masalah satu pokok kepada dua puluh pokok seterusnya. Lakukannya dalam pokok yang sama juga, sebelum berpindah daripada lesi ke kayu yang bersih — jika tidak, anda hanya menolak patogen masuk ke dalam kayu yang sihat." },
  { s:"do", zh:"怎么消：酒精最省事，漂白水最便宜", en:"How: alcohol is easiest, bleach is cheapest", ms:"Cara: alkohol paling mudah, peluntur paling murah",

  { s:"harm", zh:"没用的做法", en:"What does not work", ms:"Apa yang tidak berkesan",

    en2:"Wiping with a rag, rinsing with water, or a couple of swipes on your trousers is not disinfection — it just spreads the sawdust around. The damp wood dust you cannot see on the blade is the inoculum. And do not clean only the tip: everything that touched diseased tissue counts.", ms2:"Mengelap dengan kain, membilas dengan air, atau menyapu pada seluar bukan penyahkumanan — itu hanya menyebarkan habuk kayu. Habuk kayu lembap yang tidak kelihatan pada mata alat itulah sumber jangkitannya. Dan jangan bersihkan hujungnya sahaja: semua bahagian yang menyentuh tisu berpenyakit dikira." },
  { s:"do", zh:"不只是刀：手套、鞋底、除草机", en:"Not just blades: gloves, boots, the strimmer", ms:"Bukan mata alat sahaja: sarung tangan, kasut, mesin rumput",
    zh2:"根部病害尤其如此——带着病土从一棵树走到另一棵，跟用脏刀是一回事。刚处理过病株，先清鞋底再进健康区；除草机打到过病树头，也该冲一冲。",

  { s:"do", zh:"药商销售员：常常是最快到场的一位", en:"Product reps: often the fastest to show up", ms:"Wakil racun: selalunya paling cepat sampai",

  { s:"do", zh:"一个让双方对上频道的问题", en:"One question that gets you both on the same page", ms:"Satu soalan yang menyelaraskan kefahaman kedua-dua pihak",

var SRC = [
  { d:false, zh:"马来西亚气象局气候资料：东北季风约 11 月至 3 月，是全国主要雨季，对东海岸（吉兰丹、登嘉楼、彭亨、东柔佛）影响最大；西南季风约 5 月底至 9 月，相对干燥；4–5 月与 10–11 月为季风过渡期，午后雷雨频繁。半岛东海岸各州以 11、12、1 月雨量最大，6、7 月为多数地区最干月份。「现场」页的年历雨量部分据此绘制。", en:"MetMalaysia climate information: the northeast monsoon runs roughly November to March and is the country's main rainy season, affecting the east coast states (Kelantan, Terengganu, Pahang, east Johor) most; the southwest monsoon runs late May to September and is relatively drier; April–May and October–November are inter-monsoon transitions with frequent afternoon thunderstorms. For east-coast peninsular states November, December and January carry maximum rainfall, while June and July are the driest months in most districts. The rainfall bands on the Field tab calendar are drawn from this.", ms:"Maklumat iklim MetMalaysia: monsun timur laut berlangsung kira-kira November hingga Mac dan merupakan musim hujan utama negara, memberi kesan paling besar kepada negeri pantai timur (Kelantan, Terengganu, Pahang, Johor timur); monsun barat daya berlangsung akhir Mei hingga September dan relatifnya lebih kering; April–Mei dan Oktober–November ialah peralihan antara monsun dengan ribut petir petang yang kerap. Bagi negeri pantai timur semenanjung, November, Disember dan Januari mencatat hujan maksimum, manakala Jun dan Julai ialah bulan paling kering di kebanyakan daerah. Jalur hujan pada kalendar tab Di Ladang dilukis daripada sumber ini.", k:"g", ref:"MetMalaysia — Malaysia's Climate (met.gov.my)" },
  { d:false, zh:"白根病（Rigidoporus microporus）在马来西亚的病征：白色、纤维状的菌索紧贴根皮生长，可延伸达数米；根系在腐烂过程中变黑。接种试验中，感染后 1 个月主根表面即出现菌索，叶片症状要到 3 个月才慢慢显现——也就是说叶子开始黄的时候，根下面已经烂了几个月。子实体长在树干基部，是最明确的一条判断依据。此病寄主范围很广，包括橡胶、可可与果树。", en:"White root disease (Rigidoporus microporus) in Malaysia: white, fibrous, stringy rhizomorphs attached firmly to the root bark, able to run several metres; the root structure turns black as it rots. In inoculation trials rhizomorphs appeared on the tap root within one month of infection while foliar symptoms only developed slowly by three months — meaning that by the time leaves yellow, the roots have been rotting for months. The fruiting body at the base of the trunk is the clearest single indicator. The pathogen has a wide host range including rubber, cocoa and fruit trees.", ms:"Penyakit akar putih (Rigidoporus microporus) di Malaysia: rizomorf putih, berserabut dan berbenang melekat kuat pada kulit akar, mampu menjalar beberapa meter; struktur akar bertukar hitam ketika reput. Dalam ujian inokulasi, rizomorf muncul pada akar tunjang dalam sebulan selepas jangkitan manakala gejala pada daun hanya berkembang perlahan menjelang tiga bulan — bermakna apabila daun mula menguning, akar sudah reput berbulan-bulan. Jasad berbuah di pangkal batang ialah petunjuk tunggal yang paling jelas. Patogen ini mempunyai julat perumah yang luas termasuk getah, koko dan pokok buah-buahan.", ref:"Rigidoporus microporus virulence and morphology studies, Malaysian rubber (UPM)" },
  { d:true,  zh:"榴莲天牛（Batocera rufomaculata）：母虫在树皮上咬出凹槽状小孔并把卵产在皮下；初孵幼虫先在韧皮部取食，长大后移入心材化蛹。幼龄幼虫的为害很难察觉，长大后树皮上才看得到虫孔、流胶与木屑。重度为害可致整株死亡。", en:"Durian longhorn borer (Batocera rufomaculata): the female chews a small tunnel-shaped depression in the bark and inserts an egg beneath it; the neonate larva first feeds in the phloem, then migrates into the heartwood to pupate. Damage from small larvae is difficult to observe — the hole, dripping sap and frass become visible only once they grow. Heavy infestation can kill the tree.", ms:"Penggerek tanduk panjang durian (Batocera rufomaculata): kumbang betina mengunyah lekuk kecil berbentuk terowong pada kulit kayu dan meletakkan telur di bawahnya; larva yang baru menetas makan dalam floem dahulu, kemudian berpindah ke teras kayu untuk menjadi pupa. Kerosakan daripada larva kecil sukar dilihat — lubang, getah yang menitis dan habuk kayu hanya kelihatan setelah ia membesar. Serangan yang berat boleh mematikan pokok.", ref:"ISHS Acta Horticulturae — biology and infestation of Batocera rufomaculata in durian" },
  { d:false, zh:"针孔小蠹的化学防治证据：斯里兰卡茶树上的长期研究显示，杀虫剂即使在正确时机施用，也只有约 40% 的防效，作用是减少虫道形成、压低下一代数量。近缘的多食性小蠹（Euwallacea fornicatus / PSHB）方面，文献明确指出目前没有有效的防治手段；商品化生物制剂在实验室有效，但按现行的树皮外表施用方式，对成虫存活与繁殖影响有限。综述结论是除维持树势与清除严重受害木材外，可用手段很有限。", en:"Evidence on chemical control of shot-hole borers: long-term work on tea in Sri Lanka found that insecticides, even applied at the correct time, give only about 40% control over untreated, acting by reducing gallery formation and lowering the next generation. For the closely related polyphagous shot hole borer (Euwallacea fornicatus), the literature states plainly that there is currently no effective control measure; commercial entomopathogenic products effective in the laboratory had limited effect on beetle survival and reproduction under current outer-bark application methods. Reviews conclude options are limited beyond maintaining tree vigour and removing severely infested material.", ms:"Bukti kawalan kimia penggerek lubang jarum: kajian jangka panjang pada teh di Sri Lanka mendapati racun serangga, walaupun digunakan pada masa yang betul, hanya memberi kira-kira 40% kawalan berbanding tanpa rawatan, dengan mengurangkan pembentukan terowong dan menurunkan generasi seterusnya. Bagi penggerek lubang jarum polifagus yang berkait rapat (Euwallacea fornicatus), kajian menyatakan dengan jelas bahawa setakat ini tiada langkah kawalan yang berkesan; produk entomopatogen komersial yang berkesan di makmal memberi kesan terhad pada kemandirian dan pembiakan kumbang dengan kaedah sapuan kulit luar yang ada sekarang. Ulasan menyimpulkan pilihan adalah terhad selain mengekalkan kecergasan pokok dan membuang bahan yang teruk dijangkiti.", ref:"Chemical control of Xyleborus fornicatus in tea (Sri Lanka) + PSHB entomopathogen efficacy, South Africa (2023)" },
  { d:true,  zh:"榴莲针孔小蠹（Xyleborus fornicatus）：成虫与幼虫钻蛀树干与主枝，多见于已有根腐病的树，虫孔又把病害带到树体其他部位。", en:"Durian shot-hole borer (Xyleborus fornicatus): adults and grubs bore into the trunk and boughs, and are found mostly on trees already affected by root rot disease; the holes they make carry that disease into other parts of the tree.", ms:"Penggerek lubang jarum durian (Xyleborus fornicatus): kumbang dewasa dan larvanya menggerek batang dan dahan besar, dan kebanyakannya ditemui pada pokok yang sudah dijangkiti penyakit reput akar; lubang yang dibuatnya membawa penyakit itu ke bahagian lain pokok.", ref:"Durian shot-hole borer species note" },
  { d:true,  zh:"马来西亚农业局残留资料库（mymrl.doa.gov.my）榴莲条目：全表八项，杀菌剂仅三支——三乙膦酸铝 MRL 1 mg/kg／安全间隔 30 天；甲霜灵 0.2 mg/kg／21 天；苯醚甲环唑 0.8 mg/kg／1 天（待宪报）。其余为杀虫剂与除草剂。本软件所有药剂的「大马登记」一栏据此标示。", en:"DOA pesticide residue database (mymrl.doa.gov.my), durian entry: eight items in total, of which three are fungicides — fosetyl-Al MRL 1 mg/kg / PHI 30 days; metalaxyl 0.2 mg/kg / 21 days; difenoconazole 0.8 mg/kg / 1 day (awaiting gazette). The rest are insecticides and herbicides. Every Malaysia badge in this app is set from this source.", ms:"Pangkalan data residu racun perosak DOA (mymrl.doa.gov.my), catatan durian: lapan item kesemuanya, tiga daripadanya racun kulat — fosetyl-Al MRL 1 mg/kg / TDMH 30 hari; metalaxyl 0.2 mg/kg / 21 hari; difenoconazole 0.8 mg/kg / 1 hari (menunggu warta). Selebihnya racun serangga dan racun rumpai. Setiap label Malaysia dalam aplikasi ini ditetapkan daripada sumber ini.", k:"g", ref:"DOA.Residu — Komoditi: Durian (mymrl.doa.gov.my/Commodities/15)" },
  { d:true,  zh:"马来西亚禁用与限用农药名单（BKRPB，2025 年 8 月 26 日更新）：已核对，本软件「药剂」页列出的三支活性成分均不在禁用或限用名单上。该名单每月更新，请自行复核最新版。", en:"Malaysian banned and restricted pesticide list (BKRPB, updated 26 August 2025): checked — none of the three actives listed on the Chemicals tab appears on the banned or restricted list. The list is updated monthly; verify the current version yourself.", ms:"Senarai racun perosak diharamkan dan dihadkan Malaysia (BKRPB, dikemas kini 26 Ogos 2025): disemak — tiada satu pun daripada tiga bahan aktif yang disenaraikan dalam tab Racun Kulat terdapat dalam senarai diharamkan atau dihadkan. Senarai ini dikemas kini setiap bulan; sahkan sendiri versi terkini.", k:"g", ref:"BKRPB Senarai Racun Makhluk Perosak Diharamkan, 26 Ogos 2025" },
  { d:true,  zh:"镰刀菌通路的依据：泰国东部与海南的榴莲茎腐样本都分离到腐皮镰刀菌。本页的镰刀菌症状条目建立在这两项分离记录，加上镰刀菌属公认的形态特征（产孢座为粉白／粉红／橙色霉层，不形成分生孢子器），而非某一套榴莲专属的症状检索表。", en:"Basis for the Fusarium pathway: Fusarium solani was isolated from durian stem rot in both Eastern Thailand and Hainan. The Fusarium symptom entries here rest on those two isolation records plus the accepted morphology of the genus (sporodochia as white, pink or orange mould masses; no pycnidia) — not on a durian-specific symptom key.", ms:"Asas bagi laluan Fusarium: Fusarium solani dipencilkan daripada reput batang durian di Thailand Timur dan Hainan. Catatan gejala Fusarium di sini bersandar pada dua rekod pemencilan itu serta morfologi genus yang diterima umum (sporodokia sebagai gumpalan kulapuk putih, merah jambu atau jingga; tiada piknidia) — bukan pada kunci gejala khusus durian.", ref:"New Disease Reports 44 e12026 (2021) + Pathogens 15(8):849 (2025) + genus morphology" },
  { d:true,  zh:"泰国东部榴莲茎腐：从病树皮与木质部分离出腐皮镰刀菌与拟可可毛色二孢，症状为树皮与树干溃疡、小枝枯萎、叶黄、萎蔫。", en:"Durian stem rot, Eastern Thailand: Fusarium solani and Lasiodiplodia pseudotheobromae isolated from diseased bark and wood; symptoms were bark and trunk canker, twig blight, yellow leaves and wilting.", ms:"Reput batang durian, Thailand Timur: Fusarium solani dan Lasiodiplodia pseudotheobromae dipencilkan daripada kulit kayu dan kayu yang berpenyakit; gejalanya ialah kanker kulit dan batang, hawar ranting, daun menguning dan layu.", ref:"New Disease Reports 44, e12026 (2021)" },
  { d:true,  zh:"榴莲上木霉与杀菌剂兼容性：分离到四种病原；Tri-1 对拟茎点霉（Phomopsis）抑制率 86.17%。同研究比较多种杀菌剂对木霉的影响，差异极大：部分处理 60 天后土壤菌数维持 2.93–3.67×10³ CFU/g，另一些跌至 0.12×10³ CFU/g。", en:"Trichoderma–fungicide compatibility in durian: four pathogens isolated; Tri-1 inhibited Phomopsis by 86.17%. The study compared several fungicides for their effect on Trichoderma and found a wide spread: some treatments left soil counts at 2.93–3.67×10³ CFU/g at 60 days while others dropped them to 0.12×10³ CFU/g.", ms:"Keserasian Trichoderma–racun kulat pada durian: empat patogen dipencilkan; Tri-1 merencat Phomopsis sebanyak 86.17%. Kajian itu membandingkan beberapa racun kulat dari segi kesannya pada Trichoderma dan mendapati jurang yang luas: sesetengah rawatan mengekalkan kiraan tanah pada 2.93–3.67×10³ CFU/g pada hari ke-60 manakala yang lain menurunkannya kepada 0.12×10³ CFU/g.", ref:"Agriculture and Natural Resources / compatibility study" },
  { d:true,  zh:"海南榴莲茎腐生物防治：枯草芽孢杆菌 SYST2（Bacillus subtilis）田间防效 53.51%，化学药 25.46%，商品微生物制剂 35.15%。", en:"Biocontrol of durian stem rot in Hainan: Bacillus subtilis SYST2 gave 53.51% field efficacy versus 25.46% for chemical fungicides and 35.15% for commercial microbial agents.", ms:"Kawalan biologi reput batang durian di Hainan: Bacillus subtilis SYST2 memberi keberkesanan ladang 53.51% berbanding 25.46% bagi racun kulat kimia dan 35.15% bagi agen mikrob komersial.", ref:"Pathogens 15(8):849 (2025)" },
  { d:true,  zh:"榴莲果腐：篮状菌 KUFA1604（Talaromyces tratensis）与棘孢木霉 KUFA1606 粗提物 10,000 ppm 浸果，降低可可毛色二孢病害严重度 49.41–54.51%。", en:"Durian fruit rot: crude extracts of Talaromyces tratensis KUFA1604 and T. asperellum KUFA1606 at 10,000 ppm reduced Lasiodiplodia theobromae severity by 49.41–54.51%.", ms:"Reput buah durian: ekstrak kasar Talaromyces tratensis KUFA1604 dan T. asperellum KUFA1606 pada 10,000 ppm mengurangkan keterukan Lasiodiplodia theobromae sebanyak 49.41–54.51%.", ref:"European Journal of Plant Pathology (2026)" },
  { d:false, zh:"扁桃溃疡生物防治：三株细菌对葡萄座腔菌类菌丝抑制 87／95／63%，均产水解酶，显著缩短接种枝条病斑；AC17 效果与木霉 T. atroviride 及标准化学处理相当。", en:"Almond canker biocontrol: three bacteria inhibited 87 / 95 / 63% of Botryosphaeriaceae mycelial growth, all producing hydrolytic enzymes and significantly shortening lesions on inoculated twigs; AC17 performed on a par with T. atroviride and standard chemical treatments.", ms:"Kawalan biologi kanker badam: tiga bakteria merencat 87 / 95 / 63% pertumbuhan miselium Botryosphaeriaceae, semuanya menghasilkan enzim hidrolitik dan memendekkan lesi dengan ketara pada ranting yang diinokulasi; AC17 setanding dengan T. atroviride dan rawatan kimia biasa.", ref:"Pest Management Science (2024)" },
  { d:false, zh:"苹果干部溃疡：多种内吸杀菌剂按叶面推荐剂量点涂，可降低溃疡发生率与病斑大小；新鲜修剪伤口是分生孢子的主要入侵口。后一点是本软件「当天封口」那一步的依据。", en:"Apple stem canker: several systemic fungicides applied topically at foliar rates reduced canker incidence and lesion size; fresh pruning wounds are the main entry site for conidia. That second finding is the basis for the same-day wound sealing step in this app.", ms:"Kanker batang epal: beberapa racun kulat sistemik yang disapu pada kadar semburan daun mengurangkan kejadian kanker dan saiz lesi; luka pangkasan baharu ialah tapak masuk utama bagi konidia. Penemuan kedua itulah asas langkah menutup luka pada hari yang sama dalam aplikasi ini.", ref:"Plant Disease / apple canker study" },
  { d:false, zh:"紫荆干部溃疡：单格孢 U3（Ulocladium oudemansii）与哈茨木霉 T-22＋绿木霉 G-41 的伤口处理，为降低病斑长度与病原回收率最有效的处理之一。本软件引用的是其中的生物防治部分。", en:"Redbud stem canker: wound treatments with Ulocladium oudemansii U3 and with T. harzianum T-22 + T. virens G-41 were among the most effective for reducing lesion length and pathogen recovery. It is the biocontrol part of this study that the app draws on.", ms:"Kanker batang redbud: rawatan luka dengan Ulocladium oudemansii U3 dan dengan T. harzianum T-22 + T. virens G-41 antara yang paling berkesan mengurangkan panjang lesi dan pemulihan patogen. Bahagian kawalan biologi kajian inilah yang dirujuk aplikasi ini.", ref:"Nut/ornamental Botryosphaeria management review" },
  { d:false, zh:"木霉与杀菌剂兼容性：多项研究显示三唑类与苯并咪唑类对木霉抑制可达 100%，而部分甲氧基丙烯酸酯类在推荐剂量下兼容。这是「菌剂」页下半段「相处原则」的来源，具体药剂请以标签为准。", en:"Trichoderma–fungicide compatibility: across several studies, triazoles and benzimidazoles inhibited Trichoderma by up to 100%, while some strobilurins were compatible at recommended rates. This is the source for the coexistence principles at the foot of the Microbes tab — for any specific product, go by the label.", ms:"Keserasian Trichoderma–racun kulat: merentas beberapa kajian, triazol dan benzimidazol merencat Trichoderma sehingga 100%, manakala sesetengah strobilurin serasi pada kadar disyorkan. Inilah sumber bagi prinsip hidup bersama di bahagian bawah tab Mikrob — untuk mana-mana produk tertentu, ikut labelnya.", ref:"Crop Protection / Trichoderma compatibility studies" },

function renderChrome(){
  document.documentElement.lang = LANG;
  document.title = T(STR.mark);
  document.getElementById("mark").textContent = T(STR.mark);
  var names = { zh:"中文", en:"EN", ms:"BM" };
  var nextL = LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length];
  var langBtn = document.getElementById("lang");
  langBtn.textContent = names[LANG];                     /* shows where you are */
  langBtn.setAttribute("aria-label", names[LANG] + " \u2192 " + names[nextL]);
  langBtn.title = names[nextL];
  document.getElementById("nav").innerHTML = TABS.map(function(t){
    return '<button type="button" data-tab="' + t.id + '" aria-current="' + (TAB === t.id) + '"><b>' + t.ic + "</b>" + esc(T(t)) + "</button>";
  }).join("");
  TABS.forEach(function(t){ document.getElementById("s-" + t.id).classList.toggle("on", TAB === t.id); });
}

    "修剪与清园安排在采后到雨季来临之间那一段，伤口才有时间封口；排水要在雨季前修好，不是等淹了再挖。",

    return "<circle cx='60' cy='60' r='34' fill='var(--bark3)' stroke='var(--line)' stroke-width='1.2'/>" +
      "<circle cx='60' cy='60' r='26' fill='none' stroke='var(--line)' stroke-width='1'/>" +

  };
  var cap3 = function(t, d, c){
    return "<text x='60' y='114' text-anchor='middle' font-size='11' fill='" + c + "'>" + t + "</text>" +
      d.map(function(w, i){ return "<text x='60' y='" + (128 + i * 12) + "' text-anchor='middle' font-size='8.5' fill='var(--muted)'>" + w + "</text>"; }).join("");
  };
  var a = ring(0.25, "var(--husk)") + cap3(P("不到一半", "under half", "kurang separuh"),
    P(["还有活的输导组织", "剪到病斑以外，封口"], ["living tissue remains", "cut past it, seal"], ["masih ada tisu hidup", "potong melepasinya, tutup"]), "var(--husk)");
  var b = ring(0.5, "var(--amber)") + cap3(P("约一半", "about half", "lebih kurang separuh"),
    P(["看边缘有没有愈伤", "几周后再判一次"], ["watch for callus", "judge again in weeks"], ["perhatikan kalus", "nilai semula kemudian"]), "var(--amber)");

  return "<div class='plate'><h3>" + esc(P("什么时候不该再治：看环剥了多少", "When treatment can no longer win: how far it has girdled", "Bila rawatan sudah tidak boleh menang: sejauh mana ia melingkari")) + "</h3>" +
    "<svg viewBox='0 0 360 148' xmlns='http://www.w3.org/2000/svg' role='img'>" +
    "<g>" + a + "</g><g transform='translate(120,0)'>" + b + "</g><g transform='translate(240,0)'>" + c + "</g>" +
    "<line x1='118' y1='12' x2='118' y2='136' stroke='var(--line)'/><line x1='238' y1='12' x2='238' y2='136' stroke='var(--line)'/></svg>" +
    "<p>" + esc(P("病斑绕树干或枝条一圈超过一半，上面的部分就等于断了水源，再喷什么都救不回来。这时候唯一有意义的动作是砍到病斑以下、搬走烧掉——不是继续用药。主干根颈若已过半，整棵树要列入替换计划，留着只是园里的孢子源。", "Once a lesion wraps more than half the circumference, everything above it has lost its water supply and no spray will bring it back. The only useful action then is to cut below the lesion and carry it out to burn — not to keep treating. If the main trunk at the collar is past half, plan to replace the tree; leaving it standing just keeps a spore source in the orchard.", "Apabila lesi melingkari lebih separuh lilitan, semua bahagian di atasnya sudah kehilangan bekalan air dan tiada semburan boleh memulihkannya. Tindakan yang berguna hanyalah memotong di bawah lesi dan membawanya keluar untuk dibakar — bukan meneruskan rawatan. Jika batang utama di pangkal sudah melebihi separuh, rancang untuk menggantikan pokok itu; membiarkannya berdiri hanya mengekalkan sumber spora dalam kebun.")) + "</p></div>";
}

    oomy ? "没有一支药同时管卵菌和真菌。卵菌药对真菌无效，真菌药对卵菌无效——想一次喷完是行不通的。"
         : "两者都是真菌，但镰刀菌对多数药的敏感性低于葡萄座腔菌类，别用同一支药套两个病。",
    "先救主干与根颈，枝条其次。主干保不住，救回来的枝条也没用。",

  ], [
    "Treat the two entry points separately: Phytophthora and Fusarium come in at the collar — drainage, clear the mulch; the Botryosphaeriaceae come in through wounds above — cut to clean wood and seal the same day.",

         : "Both are fungi, but Fusarium is less sensitive to most products than the Botryosphaeriaceae. Do not stretch one product across both.",
    "Save the trunk and collar first, branches second. A branch saved on a failing trunk is wasted work.",
    "A double infection almost always points at one root cause: a weak tree. Drainage, roots, crop load — fix those or it returns."
  ], [
    "Rawat dua pintu masuk itu secara berasingan: Phytophthora dan Fusarium masuk di pangkal batang — saliran, alihkan sungkupan; Botryosphaeriaceae masuk melalui luka di atas — potong sampai kayu bersih dan tutup pada hari yang sama.",
    oomy ? "Tiada satu produk pun meliputi oomiset dan kulat sekali gus. Racun oomiset tiada kesan pada kulat dan begitu juga sebaliknya — satu semburan tidak akan mencukupi."

    "Selamatkan batang dan pangkal dahulu, dahan kemudian. Dahan yang diselamatkan pada pokok yang batangnya gagal hanyalah kerja terbuang.",

function symRow(s){

  return '<div class="sym" data-sym="' + s.id + '" data-on="' + (picked[s.id] ? 1 : 0) + '" role="checkbox" tabindex="0" aria-checked="' + (picked[s.id] ? "true" : "false") + '">' +

function renderTriage(){
  var sc = {}, n = 0;
  PATH.forEach(function(q){ sc[q.k] = 0; });
  SYMPTOMS.forEach(function(s){
    if (picked[s.id]) { PATH.forEach(function(q){ sc[q.k] += (s[q.k] || 0); }); n++; }
  });
  var ranked = PATH.map(function(q){ return sc[q.k]; }).sort(function(x, y){ return y - x; });
  var top = ranked[0];

  var order = PATH.slice().sort(function(a, b2){ return sc[b2.k] - sc[a.k]; });
  var sec = ranked[1];
  var v, mixed = null;
  if (n === 0) v = VERDICT.n;
  else if (top === 0) v = VERDICT.z;
  else if (sec >= 4 && sec >= top * 0.6) {
    /* both have real support — call it a double infection, not "inconclusive" */
    mixed = [order[0], order[1]];
    v = { zh: "两种并发：" + order[0].zh + " ＋ " + order[1].zh,
          en: "Two at once: " + order[0].en + " + " + order[1].en,
          ms: "Dua serentak: " + order[0].ms + " + " + order[1].ms,
          zh2: STR.mix_lead.zh, en2: STR.mix_lead.en, ms2: STR.mix_lead.ms };
  } else if (top - sec >= 2) {
    var lead = order[0];
    v = { zh:"倾向 " + lead.zh, en:"Leaning " + lead.en, ms:"Cenderung kepada " + lead.ms,
          zh2:lead.zh2, en2:lead.en2, ms2:lead.ms2 };
  } else v = VERDICT.x;

  var h = "<h2>" + esc(T(STR.t_triage)) + "</h2><p class='lede'>" + esc(T(STR.l_triage)) + "</p>";
  h += plate();
  h += "<div class='gauge'>";
  h += PATH.map(function(q){
    var w = top > 0 ? Math.round((sc[q.k] / top) * 100) : 0;
    return "<div class='grow'><div class='glabel'><span class='gname' style='color:" + q.c + "'>" + esc(T(q)) +
      "</span><span class='gval'>" + sc[q.k] + "</span></div>" +
      "<div class='gtrack'><div class='gfill' style='width:" + w + "%;background:" + q.c + "'></div></div></div>";
  }).join("");
  h += "<div class='readout'><b>" + esc(T(v)) + "</b><br>" + esc(body2(v)) + "</div>" +
       "<div class='legend'>" +
         "<div class='lrow'><span class='pin p'>" + esc(T(STR.pin_p)) + "</span>" + esc(T(STR.legend_p)) + "</div>" +
         "<div class='lrow'><span class='pin b'>" + esc(T(STR.pin_b)) + "</span>" + esc(T(STR.legend_b)) + "</div>" +
         "<div class='lrow'><span class='pin f'>" + esc(T(STR.pin_f)) + "</span>" + esc(T(STR.legend_f)) + "</div>" +
         "<div class='lrow'><span class='pin r'>" + esc(T(STR.pin_r)) + "</span>" + esc(T(STR.legend_r)) + "</div>" +
         "<div class='lrow'><span class='pin n'>" + esc(T(STR.pin_n)) + "</span>" + esc(T(STR.legend_n)) + "</div>" +
       "</div></div>";

  h += "<div class='mini'><span class='mini-v'>" + esc(T(v)) + "</span>" +
       "<span class='mini-b'>" + PATH.map(function(q){
         var w = top > 0 ? Math.round((sc[q.k] / top) * 100) : 0;
         return "<span class='mini-t'><span class='mini-f' style='width:" + w + "%;background:" + q.c + "'></span></span>";
       }).join("") + "</span>" +
       "<span class='mini-n'>" + n + "/" + SYMPTOMS.length + "</span></div>";

  var fastRows = SYMPTOMS.filter(function(x){ return FAST.indexOf(x.id) > -1; });
  var restRows = SYMPTOMS.filter(function(x){ return FAST.indexOf(x.id) < 0; });
  h += "<h3>" + esc(T(STR.t_fast)) + "</h3><p class='lede'>" + esc(T(STR.l_fast)) + "</p>";
  h += "<div class='fast'>" + fastRows.map(symRow).join("") + "</div>";
  h += "<button class='reset' type='button' id='showall'>" +
       esc(SHOWALL ? T(STR.hide_all) : T(STR.show_all)) + "</button>";
  if (SHOWALL) h += "<h3>" + esc(T(STR.t_rest)) + "</h3>" + restRows.map(symRow).join("");
  h += "";
  h += '<button class="reset" type="button" id="reset">' + esc(T(STR.reset)) + "</button>";
  h += renderHelper();
  if (mixed) h += mixedCard(mixed);
  document.getElementById("s-triage").innerHTML = h;
}

      "所有插图：按病理特征画的示意图，不是马来西亚榴莲实物照片。"
    ], [
      "The triage scores and weights: how much each symptom counts, how a double infection is called, how far ahead a verdict must be — these follow pathology logic and have not been validated in the field. The direction is sound; the numbers themselves are not data.",
      "Stopping treatment past half-girdled: a general principle of tree physiology (severed conducting tissue does not recover), not a durian trial result.",
      "The crop, pruning and sanitation bands on the calendar: written to general practice. States and orchards differ widely — adjust to your own. (The rainfall bands are sourced from MetMalaysia, below.)",
      "Tool disinfection rates and times: standard horticultural practice, not durian-specific research.",
      "All illustrations: schematic drawings from pathology, not photographs of Malaysian durian."
    ]).map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
  h += SRC.map(function(s){
    var k = s.k || (s.d ? "d" : "o");
    var lbl = k === "d" ? T(STR.tag_d) : (k === "g" ? T(STR.tag_g) : T(STR.tag_o));
    return "<div class='src'><b><span class='tag " + (k === "o" ? "" : k) + "'>" + esc(lbl) + "</span>" + esc(s.ref) + "</b><span>" + esc(T(s)) + "</span></div>";
  }).join("");
  h += plateShare();
  document.getElementById("s-src").innerHTML = h;
}

function renderAll(){ renderChrome(); renderTriage(); renderChem(); renderBio(); renderFruit(); renderField(); renderSrc(); }

/* innerHTML re-render drops focus; put it back on the row that was toggled,
   otherwise a keyboard or screen-reader user is dumped to the top of the page. */
function refocus(sel){
  var el = document.querySelector(sel);
  if (el && document.activeElement === document.body) el.focus({ preventScroll:true });
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-tab]");
  if (t) { TAB = t.dataset.tab; lsSet("dct-tab", TAB); renderChrome(); window.scrollTo(0, 0); return; }

  if (e.target.closest("#lang")) {
    LANG = LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length];
    lsSet("dct-lang", LANG); renderAll(); return;
  }
  var s = e.target.closest("[data-sym]");
  if (s) { var id = s.dataset.sym; picked[id] = !picked[id]; lsSet("dct-sym", JSON.stringify(picked));
    renderTriage(); refocus("[data-sym='" + id + "']"); return; }

  if (e.target.closest("#reset")) { picked = {}; lsSet("dct-sym", "{}"); renderTriage(); return; }


  var c = e.target.closest("[data-chem]");
  if (c) { c.dataset.open = c.dataset.open === "1" ? "0" : "1"; return; }

  if (e.target.closest("#foldcompat")) {
    SHOWMIX = !SHOWMIX;
    renderBio();
    return;
  }

  if (e.target.closest("#showall")) {
    SHOWALL = !SHOWALL;
    renderTriage();
    return;
  }

  var hp = e.target.closest("[data-help]");
  if (hp) {
    HELP = hp.dataset.help;
    var host = document.querySelector(".helper");
    if (host) host.outerHTML = renderHelper();
    return;
  }

  var st = e.target.closest("[data-step]");
  if (st) { var i = st.dataset.step; done[i] = !done[i]; lsSet("dct-steps", JSON.stringify(done));
    renderField(); refocus("[data-step='" + i + "']"); return; }
});

document.addEventListener("keydown", function(e){
  if (e.key !== "Enter" && e.key !== " ") return;
  var el = e.target.closest("[data-sym],[data-step]");
  if (el) { e.preventDefault(); el.click(); }
});


renderAll();

/* ---------- PWA: install, offline, and a visible update path ---------- */
(function () {
  if (!("serviceWorker" in navigator) || location.protocol.indexOf("http") !== 0) return;

  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  function offerUpdate(worker) {
    if (document.getElementById("upd")) return;
    var msg = { zh: "有新版本，点一下更新", en: "A new version is ready — tap to update",
                ms: "Versi baharu sedia — ketik untuk kemas kini" };
    var bar = document.createElement("button");
    bar.id = "upd";
    bar.type = "button";
    bar.textContent = msg[LANG] || msg.en;
    bar.addEventListener("click", function () {
      bar.disabled = true;
      worker.postMessage("SKIP_WAITING");
    });
    document.body.appendChild(bar);
  }

  navigator.serviceWorker.register("./sw.js").then(function (reg) {
    // a worker already waiting from a previous visit
    if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);

    reg.addEventListener("updatefound", function () {
      var nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", function () {
        // installed + an existing controller means this is an update, not a first install
        if (nw.state === "installed" && navigator.serviceWorker.controller) offerUpdate(nw);
      });
    });

    // check for a new build on launch, when the app is brought back, and hourly
    var check = function () { reg.update().catch(function () {}); };
    check();
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") check();
    });
    setInterval(check, 60 * 60 * 1000);
  }).catch(function () { /* offline first run, or file:// — app still works */ });
})();
</script>
